[project]
name = "my-autox-server"
version = "0.1.0"
description = "A phone agent that chooses instead of generating. Same control flow as jev-ultrafast, but the browser harness is replaced by AutoX.js MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["httpx[http2]>=0.28,<1"]

[project.scripts]
autox = "mobile_jev_ultrafast.demo:main"
autox-run = "mobile_jev_ultrafast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_jev_ultrafast"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
